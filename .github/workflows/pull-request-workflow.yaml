name: PR pipeline
on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "images/**"
      - "config/**"
      - ".github/workflows/pull-request-workflow.yaml"

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Run tests
        run: make test-ci

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Unit tests
          path: test-report.json
          reporter: golang-json

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build images
        env:
          MANAGER_IMAGE: wireguard-operator/manager:test
          AGENT_IMAGE: wireguard-operator/agent:test
        run: |
          make docker-build-integration-test

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: azure/setup-kubectl@v5

      - name: Run e2e tests
        run: |
          make kind
          make run-e2e AGENT_IMAGE=wireguard-operator/agent:test MANAGER_IMAGE=wireguard-operator/manager:test SKIP_CLEANUP=1

      - name: Dump cluster state on failure
        if: failure()
        run: |
          set +e
          kubectl config use-context kind-wg-kind-test
          docker version --format '{{.Server.Version}}'
          uname -r
          kubectl get nodes -o wide
          kubectl get pods -A -o wide
          kubectl get deploy,wireguard,wireguardpeer -A
          kubectl describe pods -n default
          kubectl get events -A --sort-by=.lastTimestamp | tail -60
          for p in $(kubectl get pods -n default -o name); do
            echo "=== logs $p"; kubectl logs -n default "$p" --all-containers --tail=80
            echo "=== previous $p"; kubectl logs -n default "$p" --all-containers --previous --tail=80
          done
          kubectl logs -n wireguard-system deploy/wireguard-controller-manager --all-containers --tail=120
