name: ci-noden

on:
  push:
    branches: [noden/main, "feature/**"]
    tags: ["noden-v*"]
  pull_request:
    branches: [noden/main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/node-networks-au/wireguard-operator
  AGENT_REPO: ghcr.io/node-networks-au/wireguard-operator/agent
  # Force any action still shipping Node.js 20 onto the Node.js 24 runner.
  # GitHub deprecates Node 20 on 2026-06-02 and removes it 2026-09-16. We
  # bumped the actions that have a Node-24-compatible major (checkout v5,
  # setup-go v6, build-push-action v6), but the Docker org's login-action
  # and setup-buildx-action still ship Node 20 on their latest releases —
  # this env var covers them until those repos cut new majors.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true
      - run: make test
      - run: make build

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          SHA=$(git rev-parse --short HEAD)
          REF_TAG=""
          if [ "${{ github.ref_type }}" = "tag" ]; then REF_TAG="${{ github.ref_name }}"; fi
          BRANCH_TAG="noden-${{ github.ref_name }}"
          BRANCH_TAG_SANITISED=$(echo "$BRANCH_TAG" | sed 's|/|-|g')
          echo "operator_tags=${IMAGE_REPO}:${SHA},${IMAGE_REPO}:${BRANCH_TAG_SANITISED}${REF_TAG:+,${IMAGE_REPO}:${REF_TAG}}" >> $GITHUB_OUTPUT
          echo "agent_tags=${AGENT_REPO}:${SHA},${AGENT_REPO}:${BRANCH_TAG_SANITISED}${REF_TAG:+,${AGENT_REPO}:${REF_TAG}}" >> $GITHUB_OUTPUT
      - name: Build + push operator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/manager/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.operator_tags }}
          platforms: linux/amd64,linux/arm64
      - name: Build + push agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/agent/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.agent_tags }}
          platforms: linux/amd64,linux/arm64
