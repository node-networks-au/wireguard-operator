name: ci-noden

on:
  push:
    branches: [noden/main, "feature/**"]
    tags: ["noden-v*"]
  pull_request:
    branches: [noden/main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/node-networks-au/wireguard-operator
  AGENT_REPO: ghcr.io/node-networks-au/wireguard-operator/agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - run: make test
      - run: make build

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          SHA=$(git rev-parse --short HEAD)
          REF_TAG=""
          if [ "${{ github.ref_type }}" = "tag" ]; then REF_TAG="${{ github.ref_name }}"; fi
          BRANCH_TAG="noden-${{ github.ref_name }}"
          BRANCH_TAG_SANITISED=$(echo "$BRANCH_TAG" | sed 's|/|-|g')
          echo "operator_tags=${IMAGE_REPO}:${SHA},${IMAGE_REPO}:${BRANCH_TAG_SANITISED}${REF_TAG:+,${IMAGE_REPO}:${REF_TAG}}" >> $GITHUB_OUTPUT
          echo "agent_tags=${AGENT_REPO}:${SHA},${AGENT_REPO}:${BRANCH_TAG_SANITISED}${REF_TAG:+,${AGENT_REPO}:${REF_TAG}}" >> $GITHUB_OUTPUT
      - name: Build + push operator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: images/manager/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.operator_tags }}
          platforms: linux/amd64,linux/arm64
      - name: Build + push agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: images/agent/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.agent_tags }}
          platforms: linux/amd64,linux/arm64
